# nacos-sync-backend 引导配置（bootstrap）
#
# 本 Nacos 与同步目标集群完全无关，仅作为 nacos-sync-backend 自身的
# 「配置中心」：服务启动后，按下方连接信息连上它，再从 configDataId
# 指定的 dataId 拉取【运行时配置】（真正的同步拓扑、端口、范围等）。
#
# 磁盘上这份文件只负责「去哪取配置」，不放任何业务拓扑。

nacos:
