  port: 8848                # 配置中心 Nacos 端口
  username: nacos           # 访问该 Nacos 的用户名
  password: ENC(fCjv6yst39A/exJJU+nfbD7o3ztW6PLHQlwU046QStpZ3Yqp)
  cfg-namespace: "config"
  reg-namespace: "public"
  appname: NACOS-SYNC
  configDataId: nacos-sync-backend-runtime.yaml  # 存放运行时配置的 dataId

logging-path: /tmp
secret-key: ${NACOS_SYNC_SECRET_KEY}